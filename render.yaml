# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploy: push this repo to GitHub, then in Render choose
# "New +" -> "Blueprint" and pick this repo (or click the deploy button in
# the README). Render provisions the Postgres database and the web service,
# runs migrations during build, and starts the Next.js server.
services:
  - type: web
    name: kid-korn-ai-agent
    runtime: node
    region: singapore
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /ping
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: PNPM_VERSION
        value: 10.32.1
      # Session encryption key (auto-generated by Render).
      - key: AUTH_SECRET
        generateValue: true
      # Database created by this blueprint; migrations run during `pnpm build`.
      - key: POSTGRES_URL
        fromDatabase:
          name: kid-korn-postgres
          property: connectionString
      # Puter API token — https://puter.com/dashboard -> "Create token".
      # Used as the fallback AI credential (users who sign in with Puter
      # bring their own token via the User-Pays model).
      - key: PUTER_AUTH_TOKEN
        sync: false
      # Optional: override the model catalog (JSON array of ChatModel).
      # - key: AI_MODELS_JSON
      #   value: '[{"id":"puter/gpt-5.4-nano","name":"GPT-5.4 nano","provider":"puter","description":"Fast"}]'
      - key: AI_TITLE_MODEL
        value: puter/gpt-4o-mini
      # Optional: enables image uploads (Vercel Blob token).
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
      # Optional: enables IP rate limiting (Redis).
      - key: REDIS_URL
        sync: false

databases:
  - name: kid-korn-postgres
    plan: free
    databaseName: kid_korn
    user: kid_korn
